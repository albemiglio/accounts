# AxVaults (Artillex-Studios/AxVaults) player vaults. Schema confirmed against SQLite.java/MySQL.java/
# H2.java CREATE TABLE: axvaults_data(uuid VARCHAR(36) dashed, storage blob). The plugin's DEFAULT
# backend is H2 2.1.214 (runtime-fetched via Zapper, Libraries.java) — pinned below; the engine fetches
# that exact driver, sniffs the store header and refuses a mismatched file instead of corrupting it.
# AxVaults created its H2 tables backtick-quoted lowercase in MODE=MySQL, so the replacers use
# double-quoted names (H2 would upper-case them unquoted). For the sqlite/mysql alternatives use the
# commented blocks AND drop the double quotes from the replacers (plain axvaults_data / uuid).
# axvaults_blocks is location-keyed (no uuid); vault item blobs may embed skull uuids (cosmetic).
# Run with the server stopped — vaults are cached in RAM and auto-saved every 5 minutes.
name: axvaults
platform: SPIGOT
type: sql
enabled: true
database:
  type: h2
  database: plugins/AxVaults/data
  h2-version: "2.1.214"
  username: sa
  password: ""
# database:
#   type: sqlite
#   database: plugins/AxVaults/data.db
# database:
#   type: mysql
#   host: localhost
#   port: 3306
#   username: minecraft
#   password: secret
#   database: axvaults
replacers:
  - table: '"axvaults_data"'
    column: '"uuid"'
# MySQL only (ephemeral cross-server sync queue, unquoted):
#  - table: axvaults_messages
#    column: uuid
