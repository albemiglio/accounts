# AdvancedKits by Extremall (closed-source; SpigotMC 90054 = BuiltByBit 18285). Evidence from the
# author's OFFICIAL API repo (extremall-dev/AdvancedKitsAPI, config.yml): default storage is YAML
# (storage.database: YAML, folder playerdata) -> one plugins/AdvancedKits/playerdata/<uuid>.yml per
# player holding kit levels/usages/cooldowns keyed by KIT NAME — no uuid inside, rename is complete.
