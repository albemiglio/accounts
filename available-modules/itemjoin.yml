# ItemJoin (RockinChaos/ItemJoin) on its default backend, SQLite — verified against decompiled ChaosCore
# (the shaded SQL layer) AND the live production database.db. File plugins/ItemJoin/database.db
# (Controller.java:78-79, dataFolder="database"); MySQL:false => SQLite (config.yml:35); prefix ij_
# (PluginData.java:378). Nine ij_* player tables share the column Player_UUID (dashed UUID.toString(),
# PlayerHandler.java:345); the non-player ij_map_ids table has no Player_UUID and is left out. Usually
# empty in practice (rows only for first-join tracking, region return-items, cooldowns). For the MySQL
# backend swap the database block (keys per config.yml:36-41); same table/column names. Run stopped.
name: itemjoin
platform: SPIGOT
type: sql
enabled: true
database:
  type: sqlite
  database: plugins/ItemJoin/database.db
replacers:
  - table: ij_first_join
    column: Player_UUID
  - table: ij_first_world
    column: Player_UUID
  - table: ij_ip_limits
    column: Player_UUID
  - table: ij_first_commands
    column: Player_UUID
  - table: ij_enabled_players
    column: Player_UUID
  - table: ij_return_items
    column: Player_UUID
  - table: ij_return_switch_items
    column: Player_UUID
  - table: ij_return_craftitems
    column: Player_UUID
  - table: ij_on_cooldown
    column: Player_UUID
