# GravesX (legoman99573/GravesX, fork of Ranull's Graves). Schema confirmed against DataManager.java:
# table <prefix>grave (prefix default empty) with owner_uuid/killer_uuid VARCHAR bound u.toString() ->
# dashed. ⚠ The plugin's DEFAULT backend is H2 (settings.storage.type: H2 -> data/graves.data.mv.db),
# which this engine cannot open — this template targets MySQL/MariaDB installs; the legacy pre-H2
# SQLite file (data/data.db) also works if still in use. grave.uuid is the grave's own id and the
# entity/block/hologram tables hold grave/world-entity uuids — excluded (grave entities in the world are
# the world module's territory). killer_uuid may hold a mob uuid: the exact-value UPDATE can't
# false-positive. Inventory blobs may embed skull uuids (cosmetic, not rewritten). Server stopped.
name: gravesx
platform: SPIGOT
type: sql
enabled: true
database:
  type: mysql
  host: localhost
  port: 3306
  username: minecraft
  password: secret
  database: graves
# Legacy pre-H2 installs:
# database:
#   type: sqlite
#   database: plugins/GravesX/data/data.db
replacers:
  - table: grave
    column: owner_uuid
  - table: grave
    column: killer_uuid
